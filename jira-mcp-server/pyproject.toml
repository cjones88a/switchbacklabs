[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-mcp-server"
version = "0.1.0"
description = "Production MCP server for Jira Cloud using FastMCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Switchback Labs" }]
keywords = ["mcp", "jira", "fastmcp", "atlassian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.6.0",
  "fastmcp>=2.3.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "mypy>=1.11.0"]

[project.scripts]
jira-mcp-server = "jira_mcp_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["jira_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"
